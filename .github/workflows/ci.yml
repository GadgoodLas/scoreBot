name: Robust CI & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # ─── Étape 1 : Qualité du code, Formatage & Tests ───
  code_quality_and_tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis (dart analyze)
        run: dart analyze --fatal-infos

      - name: Run automated tests (flutter test)
        run: flutter test --coverage

  # ─── Étape 2 : Vérification de la Compilation (Phone & Watch) ───
  compilation_check:
    name: Build Verification (Phone & Watch)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Phone APK (Compilation check)
        run: flutter build apk --flavor phone --debug

      - name: Build Android Watch APK (Compilation check)
        run: flutter build apk --flavor watch --debug

  # ─── Étape 3 : Fusion Automatique (Auto-Merge) ───
  auto_merge:
    name: Auto-Merge Pull Request
    needs: [code_quality_and_tests, compilation_check]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        github.actor == 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'auto-merge') ||
        github.event.pull_request.user.login == github.repository_owner
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto-Approve & Enable Auto-Merge
        run: |
          echo "All checks (Quality, Tests, Compilation) passed successfully!"
          echo "Approving PR #${{ github.event.pull_request.number }}..."
          gh pr review --approve "$PR_URL"
          echo "Enabling auto-merge (squash)..."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
