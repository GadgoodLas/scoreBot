name: Build & Deploy ScoreBot

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  test_and_build:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    env:
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure .env exists for asset bundling
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Setup Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Une clé temporaire produirait un bundle refusé par le Play Store : on échoue.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant : impossible de signer le bundle de release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/scorebot-release-key.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../scorebot-release-key.jks
          EOF

      - name: Build Android App Bundles & APKs (Phone & Watch)
        run: |
          # Bundles pour le store
          flutter build appbundle --flavor phone --release
          flutter build appbundle --flavor watch --release
          # APKs pour installation directe
          flutter build apk --flavor phone --release
          flutter build apk --flavor watch --release

      - name: Upload Phone Bundle as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-phone-bundle
          path: build/app/outputs/bundle/phoneRelease/app-phone-release.aab

      - name: Upload Watch Bundle as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-watch-bundle
          path: build/app/outputs/bundle/watchRelease/app-watch-release.aab

      - name: Upload Phone APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-phone-apk
          path: build/app/outputs/flutter-apk/app-phone-release.apk

      - name: Upload Watch APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-watch-apk
          path: build/app/outputs/flutter-apk/app-watch-release.apk

      - name: Create or Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/app/outputs/flutter-apk/app-phone-release.apk
            build/app/outputs/flutter-apk/app-watch-release.apk
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab
            build/app/outputs/bundle/watchRelease/app-watch-release.aab
          generate_release_notes: true

      # Le contexte `secrets` est interdit dans `if:` → on passe par l'env du job.
      # Envoi uniquement sur déclenchement manuel ou tag v* (pas à chaque push sur main).
      # Rappel : le tout premier envoi d'une app doit être fait à la main dans la Play Console.
      - name: Deploy to Google Play Store
        if: ${{ env.PLAY_STORE_JSON_KEY != '' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_STORE_JSON_KEY }}
          packageName: com.scorebot.score_bot
          releaseFiles: |
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab
            build/app/outputs/bundle/watchRelease/app-watch-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: 'completed'
