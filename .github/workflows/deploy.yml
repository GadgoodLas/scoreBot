name: Build & Deploy ScoreBot

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  test_and_build:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Restore Keystore from Secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/scorebot-release-key.jks

      - name: Create key.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../scorebot-release-key.jks
          EOF

      - name: Build Android App Bundles (Phone & Watch)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Phone Bundle as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorebot-phone-bundle
          path: build/app/outputs/bundle/phoneRelease/app-phone-release.aab

      - name: Upload Watch Bundle as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorebot-watch-bundle
          path: build/app/outputs/bundle/watchRelease/app-watch-release.aab

      - name: Deploy to Google Play Store (Internal Track)
        if: env.HAS_PLAY_AUTH == 'true'
        env:
          HAS_PLAY_AUTH: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.scorebot.score_bot
          releaseFiles: |
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab
            build/app/outputs/bundle/watchRelease/app-watch-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: 'completed'
