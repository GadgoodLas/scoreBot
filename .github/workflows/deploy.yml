name: Build & Deploy ScoreBot

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  test_and_build:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure .env exists for asset bundling
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Setup Keystore & key.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring production keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/scorebot-release-key.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../scorebot-release-key.jks
          EOF
          else
            echo "No production keystore secret found, generating temporary CI keystore..."
            keytool -genkey -v -keystore android/scorebot-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias scorebot -storepass android -keypass android -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
            cat <<EOF > android/key.properties
          storePassword=android
          keyPassword=android
          keyAlias=scorebot
          storeFile=../scorebot-release-key.jks
          EOF
          fi

      - name: Build Android App Bundles (Phone & Watch)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Phone Bundle as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-phone-bundle
          path: build/app/outputs/bundle/phoneRelease/app-phone-release.aab

      - name: Upload Watch Bundle as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorebot-watch-bundle
          path: build/app/outputs/bundle/watchRelease/app-watch-release.aab

      - name: Deploy to Google Play Store
        if: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.scorebot.score_bot
          releaseFiles: |
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab
            build/app/outputs/bundle/watchRelease/app-watch-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: 'completed'
